spring.application.name=back-license-control
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
license-control.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
spring.profiles.default=local
license-control.jwt.secret=${LICENSE_CONTROL_JWT_SECRET:}
license-control.jwt.expiration-seconds=${LICENSE_CONTROL_JWT_EXPIRATION_SECONDS:28800}
license-control.frontend-origin=${FRONTEND_ORIGIN}
license-control.bootstrap.username=${LICENSE_CONTROL_BOOTSTRAP_ADMIN_USERNAME:}
license-control.bootstrap.password=${LICENSE_CONTROL_BOOTSTRAP_ADMIN_PASSWORD:}
license-control.bootstrap.email=${LICENSE_CONTROL_BOOTSTRAP_ADMIN_EMAIL:}
license-control.storage.path=${LICENSE_CONTROL_STORAGE_PATH:./storage/apks}
spring.servlet.multipart.max-file-size=${LICENSE_CONTROL_MAX_APK_SIZE:250MB}
spring.servlet.multipart.max-request-size=${LICENSE_CONTROL_MAX_APK_SIZE:250MB}
spring.datasource.hikari.data-source-properties.characterEncoding=UTF-8
spring.datasource.hikari.data-source-properties.connectionCollation=utf8mb4_0900_ai_ci
license-control.offline.private-key-path=${LICENSE_CONTROL_OFFLINE_PRIVATE_KEY_PATH:}
license-control.offline.key-id=${LICENSE_CONTROL_OFFLINE_KEY_ID:lc-device-v1}
license-control.offline.validity-seconds=${LICENSE_CONTROL_OFFLINE_VALIDITY_SECONDS:259200}
license-control.offline.zone=${LICENSE_CONTROL_OFFLINE_ZONE:America/Mexico_City}
